<!DOCTYPE html>
<html>
<head>
    <title>Auto-Input with Dervied Properties</title>
    <meta charset="UTF-8">
    <script type="module" src="auto-input-derived.js"></script>
</head>
<body>
    <h1>Auto Input With dervied Properties</h1>
    <p>You can use the Auto-Input even with derived properties (JS-Getter and Setter). Here is a Converter Component that display the decimal places of a count</p>
    <hr>
    <obj-converter name="Sheep" icon="🐑" count="5"></obj-converter>
    <obj-converter name="Cow" icon="🐄" count="3" ></obj-converter>
    <obj-converter name="Chicken" icon="🐔" count="12"></obj-converter>
    <obj-converter name="Dragon" icon="🐍" icon10="🐉"  base="8" count="1" scale></obj-converter>
    <obj-converter name="Cookies" icon="🍪" count="42"></obj-converter>
    <obj-converter name="Gold" count="1214"  icon="🪙"  icon10="💰" icon100="💎"  ></obj-converter>
    <obj-converter name="Aliens" count="21" base="16"  icon="👾"  icon10="👾👾" icon100="👾👾👾"  ></obj-converter>
</body>
</html>
